name: Linux release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake pkg-config dpkg-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools \
            libqt5x11extras5-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev \
            libv4l-dev libpipewire-0.3-dev libspa-0.2-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libgl-dev libglu1-mesa-dev

      - name: Configure
        run: >-
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr -DWITH_QT5=ON -DWITH_QT6=OFF
          -DENABLE_32BIT_GLINJECT=OFF

      - name: Build
        run: cmake --build build-release --parallel 2

      - name: Package Debian release
        run: bash scripts/package-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Upload package to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build-release/packages/*.deb
          generate_release_notes: true